name: Screenshots

on:
  push:
    branches: ["shots/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build showcase
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || { grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'; exit 1; }
          NOTCHY_CONFIGURATION=debug scripts/bundle.sh build/Showcase.app

      - name: Render
        env:
          TZ: America/Sao_Paulo
        run: |
          for pair in en:en_US pt-BR:pt_BR es:es_ES; do
            language="${pair%%:*}"
            locale="${pair##*:}"
            NOTCHY_SHOWCASE="$PWD/build/showcase/$language" \
              build/Showcase.app/Contents/MacOS/Notchy -AppleLanguages "($language)" -AppleLocale "$locale"
          done

      - name: Compose
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow
          build/venv/bin/python scripts/screenshots.py build/showcase docs/screenshots

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: |
            docs/screenshots
            build/showcase

      - name: Commit
        if: startsWith(github.ref, 'refs/heads/shots/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render screenshots"
            git push
          fi
