name: Screenshots

on:
  push:
    branches: ["shots/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build showcase
        run: |
          swift build
          NOTCHY_CONFIGURATION=debug scripts/bundle.sh build/Showcase.app

      - name: Render
        env:
          TZ: America/Sao_Paulo
        run: |
          for pair in en:en_US pt-BR:pt_BR es:es_ES; do
            language="${pair%%:*}"
            locale="${pair##*:}"
            NOTCHY_SHOWCASE="$PWD/docs/screenshots/raw/$language" \
              build/Showcase.app/Contents/MacOS/Notchy -AppleLanguages "($language)" -AppleLocale "$locale"
          done
          ls -la docs/screenshots/raw/*

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/raw
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render screenshots"
            git push
          fi
