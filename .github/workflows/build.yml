name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Compile
        run: swift build -c release

      - name: App bundle
        run: ./build.sh

      - name: Check bundle
        run: |
          plutil -lint build/Notchy.app/Contents/Info.plist
          codesign --verify --verbose build/Notchy.app
          test -f build/Notchy.app/Contents/Resources/AppIcon.icns
          test -f build/Notchy.app/Contents/Resources/hooks/install.py
          for language in pt-BR en es; do test -f "build/Notchy.app/Contents/Resources/$language.lproj/Localizable.strings"; done
          plutil -lint Resources/*.lproj/*.strings

  scripts:
    name: Scripts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax
        run: |
          for file in install.sh build.sh bin/notchy scripts/*.sh; do
            /bin/bash -n "$file"
          done

      - name: Python hooks
        run: /usr/bin/python3 -m py_compile hooks/*.py
