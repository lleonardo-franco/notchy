name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Português e español também são bem-vindos / también son bienvenidos.
        Please search [existing issues](https://github.com/lleonardo-franco/notchy/issues?q=is%3Aissue) first. Security problems go to [SECURITY.md](https://github.com/lleonardo-franco/notchy/blob/main/SECURITY.md), not here.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Music
        - YouTube in the notch
        - Claude Code
        - Calendar
        - Weather
        - Clipboard
        - Notifications (WhatsApp, ClickUp)
        - Bluetooth
        - Gestures and haptics
        - Settings and welcome window
        - Install, update or uninstall
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots or a short screen recording help a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the notch
        2. Click on ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Notchy version
      description: Output of `notchy version`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Pro 14\" M3"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Filled in automatically by Settings → About → Report a problem, or paste the output of `notchy doctor`
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Browser, music app, terminal app, logs, or anything that might be related.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this hasn't been reported yet
          required: true
        - label: I'm on the latest version (`notchy update`)
